spring.application.name=alquiler-coches-app

# ============================================
# DATABASE - MySQL (BD "alquiler_coches" creada manualmente)
# Las credenciales se cargan desde .env
# ============================================
spring.datasource.url=jdbc:mysql://localhost:3306/alquiler_coches?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ============================================
# JPA / Hibernate
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ============================================
# Servidor
# ============================================
server.port=8080

# ============================================
# JWT
# ============================================
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# ============================================
# CLOUDINARY
# La sintaxis ${VAR} significa "lee la variable de entorno VAR".
# IMPORTANTE: van SIN ":" final a propósito. ${VAR} (sin ":") hace fail-fast:
#   si la variable no existe, la app NO arranca y avisa. En cambio "${VAR:}"
#   arrancaría con valor VACÍO y en silencio -> luego fallos raros al subir.
# Las credenciales NUNCA se commitean: viven en el fichero .env (en .gitignore).
# Estas 3 propiedades las inyecta CloudinaryConfig con @Value.
# ============================================
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ============================================
# Multipart upload (Cloudinary images)
# ============================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# OpenAPI / Swagger UI
# ============================================
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.operations-sorter=alpha

# ============================================
# Logging
# ============================================
logging.level.com.alquiler.coches=DEBUG
